# ===========================================================================
# CI — lustro `skrypty/bramka.sh`.
#
# Workflow świadomie NIE powtarza logiki bramki: woła dokładnie ten sam skrypt,
# który wykonawca uruchamia u siebie. Dzięki temu „u mnie przechodzi, w CI nie"
# może wynikać tylko z różnicy środowiska, nigdy z różnicy kroków.
#
# JEDEN JOB, nie dwa. Pierwsza wersja miała osobny job `sekrety` z akcją
# `gitleaks/gitleaks-action@v2` — i to był podręcznikowy rozjazd bramki:
#   * skan sekretów istniał WYŁĄCZNIE w CI, lokalna bramka go nie miała,
#   * akcja skanowała innym narzędziem niż to, którym sprawdzaliśmy lokalnie,
#   * dla repozytorium należącego do ORGANIZACJI akcja wymaga płatnej licencji
#     i bez sekretu `GITLEAKS_LICENSE` kończy się błędem — zmierzone:
#     „[Fundacja-Niepodzielni] is an organization. License key is required."
#
# Skan sekretów jest teraz krokiem `skrypty/bramka.sh` (ten sam obraz gitleaksa
# lokalnie i w CI, ta sama konfiguracja `.gitleaks.toml`), więc osobny job stał
# się zbędny i szkodliwy naraz.
# ===========================================================================
name: ci

# WYZWALACZ NA WSZYSTKICH GAŁĘZIACH — znalezisko architekta z 08.08.
#
# Było `branches: ["main"]`, a od decyzji D-2026-08-08-23 cała praca żyje na
# gałęziach roboczych i scala się do `main` dopiero po zielonej rundzie.
# Skutek: naprawy rundy 5, BLK-22 i realmu nie miały ANI JEDNEGO przebiegu CI.
# Dyscyplina gałęzi została nakazana, a CI za nią nie podążyło.
#
# To ma znaczenie nie tylko porządkowe: CI jest JEDYNYM miejscem, w którym
# „czysty klon" jest wymuszony MASZYNOWO, a nie deklaratywnie. Na maszynie
# wykonawcy bramka biegnie w środowisku, które ten wykonawca zbudował — i to
# właśnie tam powstało V-2 („42 kontrole" zmierzone tam, gdzie akurat wychodzą).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  bramka:
    name: bramka (stos + Pint + Larastan + Pest + gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PEŁNA historia, nie płytki klon. Gitleaks w kroku bramki skanuje
          # HISTORIĘ, a nie tylko drzewo robocze: sekret usunięty kolejnym
          # commitem dalej leży w repozytorium i dalej jest wyciekiem.
          # Przy domyślnym `fetch-depth: 1` skan meldował „1 commits scanned"
          # i przechodził, nie zaglądając w przeszłość.
          fetch-depth: 0

      - name: Wersje narzędzi
        run: |
          docker --version
          docker compose version

      - name: Bramka — skrypty/bramka.sh
        env:
          NO_COLOR: "1"
        run: bash skrypty/bramka.sh --zostaw

      - name: Logi kontenerów (przy porażce)
        if: failure()
        run: docker compose -p gabinet-bramka logs --tail=200

      - name: Sprzątanie
        if: always()
        run: docker compose -p gabinet-bramka down -v --remove-orphans || true

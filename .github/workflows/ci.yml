# ===========================================================================
# CI — lustro `skrypty/bramka.sh`.
#
# Workflow świadomie NIE powtarza logiki bramki: woła dokładnie ten sam skrypt,
# który wykonawca uruchamia u siebie. Dzięki temu „u mnie przechodzi, w CI nie"
# może wynikać tylko z różnicy środowiska, nigdy z różnicy kroków.
# ===========================================================================
name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  bramka:
    name: bramka (stos + Pint + Larastan + Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wersje narzędzi
        run: |
          docker --version
          docker compose version

      - name: Bramka — skrypty/bramka.sh
        env:
          NO_COLOR: "1"
        run: bash skrypty/bramka.sh --zostaw

      - name: Logi kontenerów (przy porażce)
        if: failure()
        run: docker compose -p gabinet-bramka logs --tail=200

      - name: Sprzątanie
        if: always()
        run: docker compose -p gabinet-bramka down -v --remove-orphans || true

  sekrety:
    name: sekrety (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks skanuje HISTORIĘ, nie tylko working tree — sekret usunięty
          # kolejnym commitem dalej leży w repozytorium i dalej jest wyciekiem.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Licencja organizacyjna (wymagana przez gitleaks-action dla repozytoriów
          # należących do organizacji). Sekret ustawiony na poziomie organizacji
          # Fundacja-Niepodzielni — w repozytorium go nie ma i nie będzie.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

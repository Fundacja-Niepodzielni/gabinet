; Gabinet — ustawienia PHP wspólne dla wszystkich ról kontenera (app/horizon/scheduler).
; Zmiany produkcyjne (opcache.validate_timestamps=0 itd.) wejdą osobnym plikiem w F9.

memory_limit = 512M
max_execution_time = 60
post_max_size = 12M
upload_max_filesize = 12M

; Czas: w bazie UTC, prezentacja Europe/Warsaw (CLAUDE.md §5). Runtime trzymamy w UTC,
; żeby żadna funkcja PHP nie wprowadziła strefy tylnymi drzwiami.
date.timezone = UTC

expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Logi idą na stdout kontenera — zbiera je docker/monitoring, nie plik w wolumenie.
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off

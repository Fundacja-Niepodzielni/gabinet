# Gabinet — nginx przed php-fpm (środowisko deweloperskie).
# Produkcja dostanie własny plik w F9 (TLS, nagłówki bezpieczeństwa, cache statyków).

server {
    listen 80;
    server_name _;
    root /srv/gabinet/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;

    # Panele i API nigdy nie wchodzą do wyszukiwarek (spec M1/26).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Konfiguracja gitleaks dla repozytorium Gabinet.
# Bazujemy na regułach domyślnych i tylko je uzupełniamy — nigdy nie zastępujemy
# (podmiana zestawu reguł to najczęstszy sposób na „zielony skan bez skanowania").

title = "Gabinet — reguły wykrywania sekretów"

[extend]
useDefault = true

# --- reguły dodatkowe, specyficzne dla tego projektu ------------------------
#
# UWAGA na `\s` w tych wyrażeniach: obejmuje ZNAK NOWEJ LINII. Pierwsza wersja
# używała `\s*=\s*\S{16,}` i zapalała się na PUSTYCH przypisaniach w
# `.env.example`, bo `\S{16,}` łapało treść NASTĘPNEJ linii. Skan kończył się
# kodem 1 na pliku, który z założenia nie ma żadnych wartości.
# Dlatego wszędzie: `[ \t]*` zamiast `\s*` i kotwica `$` w trybie wieloliniowym.

[[rules]]
id = "laravel-app-key"
description = "Klucz aplikacji Laravela (APP_KEY)"
regex = '''(?m)^[ \t]*APP_KEY[ \t]*=[ \t]*base64:[A-Za-z0-9+/]{40,}={0,2}[ \t]*$'''
tags = ["laravel", "klucz"]

[[rules]]
id = "smsapi-token"
description = "Token API SMSAPI"
regex = '''(?m)^[ \t]*SMSAPI_TOKEN[ \t]*=[ \t]*[A-Za-z0-9]{24,}[ \t]*$'''
tags = ["sms", "token"]

[[rules]]
id = "keycloak-client-secret"
description = "Sekret klienta poufnego Keycloak"
regex = '''(?m)^[ \t]*KEYCLOAK_(ADMIN_)?CLIENT_SECRET[ \t]*=[ \t]*[^\s#]{16,}[ \t]*$'''
tags = ["oidc", "sekret"]

[[rules]]
id = "haslo-bazy"
description = "Hasło do bazy danych w pliku środowiskowym"
regex = '''(?m)^[ \t]*(DB_PASSWORD|POSTGRES_PASSWORD)[ \t]*=[ \t]*[^\s#]{8,}[ \t]*$'''
tags = ["baza", "haslo"]

# --- co świadomie pomijamy --------------------------------------------------

[[allowlists]]
description = "Ścieżki bez sekretów z definicji"
paths = [
  '''backend/vendor/.*''',
  '''(^|/)\.gitleaks\.toml$''',
]

[[allowlists]]
description = """
Heurystyka `generic-api-key` na .env.example — WYŁĄCZONA ŚWIADOMIE i wąsko.

Reguła domyślna gitleaksa ma ten sam problem, który naprawiliśmy w regułach
własnych: `\\s` obejmuje znak nowej linii, więc na PUSTYM przypisaniu
(`SMSAPI_TOKEN=`) dopasowuje treść NASTĘPNEJ linii i zgłasza wyciek tam,
gdzie żadnej wartości nie ma. Zmierzone: `leaks found: 1`, entropia 4.06,
sekret = nazwa nadawcy SMS z kolejnego wiersza.

Wyłączenie dotyczy JEDNEJ reguły i JEDNEGO pliku. Ten plik nie zostaje bez
ochrony: obowiązują na nim wszystkie reguły własne wyżej (APP_KEY, token
SMSAPI, sekret Keycloaka, hasło bazy), a dodatkowo test `SekretyTest`
sprawdza semantycznie, że KAŻDA zmienna sekretna jest pusta — czego żadna
heurystyka entropii nie potrafi.
"""
targetRules = ["generic-api-key"]
paths = ['''(^|/)\.env\.example$''']

[[allowlists]]
description = """
Heurystyka `generic-api-key` na raportach nocy 08/09.08 — WYŁĄCZONA WĄSKO.

Powód, zmierzony: krok bramki „sekrety" zapalił się na `leaks found: 1`, a
„sekretem" była NAZWA PLIKU we własnym dzienniku — `ZLECENIE-RUNDA-6.md`
w zdaniu „Treść obu zleceń zapisana obok:". Reguła entropijna nie odróżnia
nazwy pliku od klucza API. Żadnej wartości sekretnej tam nie ma.

Dlaczego nie samo przeredagowanie zdania: gitleaks skanuje HISTORIĘ (56
commitów), więc treść z commita `83775f4` zostaje w skanie niezależnie od
tego, co pokazuje drzewo robocze. Zdanie i tak przeredagowałem — allowlista
nie jest jedyną linią obrony, tylko domyka historię.

Dlaczego to nie jest dziura: wyłączona jest JEDNA reguła (heurystyka entropii)
na JEDNYM katalogu z raportami tekstowymi. Wszystkie reguły WŁASNE tego
projektu — `laravel-app-key`, `smsapi-token`, `keycloak-client-secret`,
`haslo-bazy` — obowiązują tam dalej, a to one opisują kształty sekretów, które
w tym repozytorium naprawdę występują. Katalog jest przy tym z definicji
prozą: raporty weryfikacji, dziennik, znaleziska.

DO ROZSTRZYGNIĘCIA (`docs/noc-2026-08-08/DO-DECYZJI.md`, poz. 1): czy taka
wyłączność ma obowiązywać dla WSZYSTKICH przyszłych katalogów raportowych,
czy każdy ma dostawać własny wpis. Wybrałem wariant najwęższy — ten jeden
katalog — bo jest odwracalny i nie tworzy precedensu na przyszłość.
"""
targetRules = ["generic-api-key"]
paths = ['''docs/noc-2026-08-08/.*''']

# `.env.example` ma same puste przypisania (pilnuje tego test `SekretyTest`),
# więc nie potrzebuje wyjątku — i celowo go nie dostaje. Gdyby ktoś wpisał tam
# wartość, MA zapalić skan. Skuteczność tej konfiguracji sprawdza krok bramki
# „sekrety (gitleaks)" — na obecnym drzewie ORAZ na podstawionej przynęcie.

[[allowlists]]
description = """
PRZYNETA PERTURBACJI w HISTORII commita 31727fb — WYLACZONA NAJWEZEJ.

Co to jest: perturbacja `p_sekrety` wpisuje do `.env.example` wartosc udajaca
sekret Keycloaka, zeby udowodnic, ze skaner ja LAPIE. Wartosc jest zmyslona —
to base64 napisu "hello-world-this-is-a-secret", nie poswiadczenie.

Skad sie wziela w repozytorium: przenoszac te podmiane z `sed` do
`perturbuj.py` (naprawa R6B-17, 12.08) wstawilem ja jako DOSLOWNY LITERAL
do sledzonego pliku. Bramka zlapala to sama i sluszznie: wysokoentropijny
napis udajacy sekret, zapisany w repozytorium, JEST drobnym wyciekiem
niezaleznie od tego, ze wartosc zmyslono.

PRZYCZYNA JEST JUZ USUNIETA W DRZEWIE: wartosc powstaje w czasie dzialania
z czytelnego ziarna (`przyneta()` w `perturbuj.py`), a skutek mutacji jest
identyczny co do bajtu — zmierzone. Ta allowlista domyka WYLACZNIE HISTORIE.

DLACZEGO NIE PRZEPISALEM HISTORII, skoro commit jest lokalny. Probowalem:
`git filter-branch` odmawia przy niezacommitowanych zmianach, a w drzewie
lezy WPIS INNEJ SESJI w `docs/DECYZJE.md` (D-2026-08-12-04). Schowanie cudzej,
niezapisanej pracy na czas przepisywania grozi jej utrata — a to gorsze niz
waski wyjatek na wartosc, ktora nie jest sekretem.

WARUNEK ZNOSZACY, i to jest dlug z terminem: przy scalaniu F1 do `main`,
gdy drzewo bedzie ciche, historie tego zakresu NALEZY przepisac i TEN WPIS
USUNAC. Kopia galezi sprzed proby: `kopia-przed-filtrem-12-08`.

Dlaczego to nie jest dziura: wyjatek dopasowuje DOKLADNIE JEDNA znana wartosc
zmyslona, a nie sciezke ani katalog. Kazdy inny sekret w tym samym pliku
zapala skaner — dowiedzione przyneta przy naprawie (patrz ZLECENIE-048).
"""
targetRules = ["generic-api-key"]
regexes = ['''aGVsbG8td29ybGQtdGhpcy1pcy1hLXNlY3JldA''']
# ZAKRES ZAWEZONY DO TRZECH COMMITOW (12.08, po pomiarze weryfikatora).
#
# Opis wyzej mowil „domyka WYLACZNIE HISTORIE", a `targetRules` + `regexes`
# bez `commits` zwalnialy te wartosc WSZEDZIE: takze w drzewie roboczym
# i we wszystkich przyszlych commitach. Zdanie bylo nieprawdziwe wobec
# wlasnej implementacji — dokladnie klasa „dokumentacja klamiaca o kodzie",
# ktora ta sesja zamyka gdzie indziej. Zmierzyl to niezalezny weryfikator:
# doslowna przyneta w `perturbuj.py` dawala `no leaks found`.
# ⛔ `condition = "AND"` — BEZ TEJ LINII WYJATEK NIE ZAWEZAL NICZEGO (R7-5).
#
# gitleaks laczy kryteria allowlisty przez OR, wiec `regexes` zwalnialo wartosc
# WSZEDZIE, a `commits` zamiast zawezac — POSZERZALO. Opis mowil „domyka
# wylacznie historie" i byl nieprawdziwy wobec wlasnej implementacji.
#
# Zmierzone przez weryfikatora rundy 7: bait w NOWYM commicie (poza trojka)
# → `no leaks found`. Kontrola pozytywna: inny sekret w tym samym pliku
# → `leaks found: 1`. Czyli zwolnienie dzialalo poza deklarowanym zakresem.
condition = "AND"
# ⛔ PELNE SHA, NIE SKROTY — druga wada tego samego wpisu, odsloniete dopiero
# przez `condition = "AND"` (pelna bramka 12.08, krok [21] CZERWONY).
#
# gitleaks porownuje identyfikator commita DOKLADNIE (`strings.EqualFold`),
# bez rozwijania skrotow. Stalo tu `31727fb215` — wiec kryterium `commits`
# nie pasowalo do NICZEGO. Przy laczeniu przez OR nie bylo tego widac: wpis
# przechodzil na samym `regexes`, czyli dokladnie tak szeroko, jak zarzucil
# weryfikator. Po zawezeniu do AND wyjatek przestal obejmowac cokolwiek
# i historyczna przyneta zapalila bramke.
#
# Dwie wady w jednym wpisie, obie tego samego rodzaju: opis mowil o zakresie,
# ktorego implementacja nie miala. Naprawa pierwszej ujawnila druga.
commits = [
  "31727fb215efc41df024b620809456e12931d351",
  "f24dfecc08c1600d998a3a4d1de3f76d59f2f0e0",
  "4ad57280d1369f2f21534d28c335cd31916c7b15",
  # Czwarty, znaleziony przy tej samej naprawie (`git log -S`): przyneta
  # byla w repozytorium wczesniej, niz mowil poprzedni opis.
  "69c9e3863670300f5deefb31cd50c6da54c32b70",
]

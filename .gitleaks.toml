# Konfiguracja gitleaks dla repozytorium Gabinet.
# Bazujemy na regułach domyślnych i tylko je uzupełniamy — nigdy nie zastępujemy
# (podmiana zestawu reguł to najczęstszy sposób na „zielony skan bez skanowania").

title = "Gabinet — reguły wykrywania sekretów"

[extend]
useDefault = true

# --- reguły dodatkowe, specyficzne dla tego projektu ------------------------
#
# UWAGA na `\s` w tych wyrażeniach: obejmuje ZNAK NOWEJ LINII. Pierwsza wersja
# używała `\s*=\s*\S{16,}` i zapalała się na PUSTYCH przypisaniach w
# `.env.example`, bo `\S{16,}` łapało treść NASTĘPNEJ linii. Skan kończył się
# kodem 1 na pliku, który z założenia nie ma żadnych wartości.
# Dlatego wszędzie: `[ \t]*` zamiast `\s*` i kotwica `$` w trybie wieloliniowym.

[[rules]]
id = "laravel-app-key"
description = "Klucz aplikacji Laravela (APP_KEY)"
regex = '''(?m)^[ \t]*APP_KEY[ \t]*=[ \t]*base64:[A-Za-z0-9+/]{40,}={0,2}[ \t]*$'''
tags = ["laravel", "klucz"]

[[rules]]
id = "smsapi-token"
description = "Token API SMSAPI"
regex = '''(?m)^[ \t]*SMSAPI_TOKEN[ \t]*=[ \t]*[A-Za-z0-9]{24,}[ \t]*$'''
tags = ["sms", "token"]

[[rules]]
id = "keycloak-client-secret"
description = "Sekret klienta poufnego Keycloak"
regex = '''(?m)^[ \t]*KEYCLOAK_(ADMIN_)?CLIENT_SECRET[ \t]*=[ \t]*[^\s#]{16,}[ \t]*$'''
tags = ["oidc", "sekret"]

[[rules]]
id = "haslo-bazy"
description = "Hasło do bazy danych w pliku środowiskowym"
regex = '''(?m)^[ \t]*(DB_PASSWORD|POSTGRES_PASSWORD)[ \t]*=[ \t]*[^\s#]{8,}[ \t]*$'''
tags = ["baza", "haslo"]

# --- co świadomie pomijamy --------------------------------------------------

[[allowlists]]
description = "Ścieżki bez sekretów z definicji"
paths = [
  '''backend/vendor/.*''',
  '''(^|/)\.gitleaks\.toml$''',
]

[[allowlists]]
description = """
Heurystyka `generic-api-key` na .env.example — WYŁĄCZONA ŚWIADOMIE i wąsko.

Reguła domyślna gitleaksa ma ten sam problem, który naprawiliśmy w regułach
własnych: `\\s` obejmuje znak nowej linii, więc na PUSTYM przypisaniu
(`SMSAPI_TOKEN=`) dopasowuje treść NASTĘPNEJ linii i zgłasza wyciek tam,
gdzie żadnej wartości nie ma. Zmierzone: `leaks found: 1`, entropia 4.06,
sekret = nazwa nadawcy SMS z kolejnego wiersza.

Wyłączenie dotyczy JEDNEJ reguły i JEDNEGO pliku. Ten plik nie zostaje bez
ochrony: obowiązują na nim wszystkie reguły własne wyżej (APP_KEY, token
SMSAPI, sekret Keycloaka, hasło bazy), a dodatkowo test `SekretyTest`
sprawdza semantycznie, że KAŻDA zmienna sekretna jest pusta — czego żadna
heurystyka entropii nie potrafi.
"""
targetRules = ["generic-api-key"]
paths = ['''(^|/)\.env\.example$''']

[[allowlists]]
description = """
Heurystyka `generic-api-key` na raportach nocy 08/09.08 — WYŁĄCZONA WĄSKO.

Powód, zmierzony: krok bramki „sekrety" zapalił się na `leaks found: 1`, a
„sekretem" była NAZWA PLIKU we własnym dzienniku — `ZLECENIE-RUNDA-6.md`
w zdaniu „Treść obu zleceń zapisana obok:". Reguła entropijna nie odróżnia
nazwy pliku od klucza API. Żadnej wartości sekretnej tam nie ma.

Dlaczego nie samo przeredagowanie zdania: gitleaks skanuje HISTORIĘ (56
commitów), więc treść z commita `83775f4` zostaje w skanie niezależnie od
tego, co pokazuje drzewo robocze. Zdanie i tak przeredagowałem — allowlista
nie jest jedyną linią obrony, tylko domyka historię.

Dlaczego to nie jest dziura: wyłączona jest JEDNA reguła (heurystyka entropii)
na JEDNYM katalogu z raportami tekstowymi. Wszystkie reguły WŁASNE tego
projektu — `laravel-app-key`, `smsapi-token`, `keycloak-client-secret`,
`haslo-bazy` — obowiązują tam dalej, a to one opisują kształty sekretów, które
w tym repozytorium naprawdę występują. Katalog jest przy tym z definicji
prozą: raporty weryfikacji, dziennik, znaleziska.

DO ROZSTRZYGNIĘCIA (`docs/noc-2026-08-08/DO-DECYZJI.md`, poz. 1): czy taka
wyłączność ma obowiązywać dla WSZYSTKICH przyszłych katalogów raportowych,
czy każdy ma dostawać własny wpis. Wybrałem wariant najwęższy — ten jeden
katalog — bo jest odwracalny i nie tworzy precedensu na przyszłość.
"""
targetRules = ["generic-api-key"]
paths = ['''docs/noc-2026-08-08/.*''']

# `.env.example` ma same puste przypisania (pilnuje tego test `SekretyTest`),
# więc nie potrzebuje wyjątku — i celowo go nie dostaje. Gdyby ktoś wpisał tam
# wartość, MA zapalić skan. Skuteczność tej konfiguracji sprawdza krok bramki
# „sekrety (gitleaks)" — na obecnym drzewie ORAZ na podstawionej przynęcie.
